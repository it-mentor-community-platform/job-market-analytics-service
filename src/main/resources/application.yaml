spring:
  application:
    name: job-market-analytics-service

hh:
  api:
    url: https://api.hh.ru
  collection:
    lookback-days: 60

rate-limit:
  capacity: 1
  refill: 1
  period: 2s
  initial-tokens: 0

scheduler:
  zone: Europe/Moscow
  job-creator:
    enabled: true
    cron: "0 0 0 * * *"

  worker:
    enabled: true
    cron: "0 */30 * * * *"


management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - health
          - info