spring:
  application:
    name: job-market-analytics-service

hh:
  api:
    url: https://api.hh.ru

rate-limit:
  capacity: 10
  refill: 10
  period: 60s

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - health
          - info